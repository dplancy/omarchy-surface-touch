# IPTS driver from linux-surface 6.19.8, adapted for Linux 7.2
# Packaged by omarchy-surface-touch, see patches/ in that repository
PACKAGE_NAME="ipts"
PACKAGE_VERSION="6.19.8.2"
BUILT_MODULE_NAME[0]="ipts"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# linux-surface already ships its own IPTS driver
BUILD_EXCLUSIVE_KERNEL="-omarchy$"
